      <div class="landscape-icons row-small">

  <script>
    // ─── AudioContext ──────────────────────────────────────────────────────────
    var audioCtx = null;
    function getAudioCtx() {
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    function playClick() {
      try {
        var ctx = getAudioCtx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(900, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, ctx.currentTime + 0.09);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.1);
      } catch(e){}
    }

    // ─── TikTok WebView детект ─────────────────────────────────────────────────
    function isTikTokWebView() {
      var ua = navigator.userAgent || '';
      return /musical_ly|TikTok|BytedanceWebview|bytedance/i.test(ua);
    }
    function showTiktokHint() {
      if(sessionStorage.getItem('tiktok_hint_closed')) return;
      if(!isTikTokWebView()) return;
      var hint = document.getElementById('tiktok-hint');
      if(!hint) return;
      hint.style.display = 'block';
      var h = hint.offsetHeight;
      document.body.style.paddingTop = (h + 'px');
      setTimeout(closeTiktokHint, 10000);
    }
    function closeTiktokHint() {
      var hint = document.getElementById('tiktok-hint');
      if(hint) hint.style.display = 'none';
      document.body.style.paddingTop = '';
      sessionStorage.setItem('tiktok_hint_closed','1');
    }

    // ─── Копирование (вибрация + звук в одном обработчике) ────────────────────
    async function copyToClipboard(text) {
      gtag('event', 'copy_phone_number');
      if(navigator.vibrate) navigator.vibrate([40, 30, 40]);
      playClick();
      try {
        await navigator.clipboard.writeText(text);
      } catch(e) {
        var el = document.createElement('textarea');
        el.value = text;
        el.style.cssText = 'position:fixed;opacity:0';
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);
      }
      var notice = document.getElementById('copy-notice');
      notice.style.opacity = '1';
      setTimeout(function(){ notice.style.opacity = '0'; }, 2000);
    }

    // ─── Меню ─────────────────────────────────────────────────────────────────
    function togglePhoneMenu() {
      var menu = document.getElementById('phone-menu');
      menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
    }
    document.addEventListener('click', function(e) {
      var menu = document.getElementById('phone-menu');
      var btn = document.querySelector('.phone-link');
      if(!menu || menu.style.display !== 'block') return;
      if(!menu.contains(e.target) && !btn.contains(e.target)) menu.style.display = 'none';
    });
    document.addEventListener('keydown', function(e) {
      if(e.key === 'Escape') {
        var menu = document.getElementById('phone-menu');
        if(menu) menu.style.display = 'none';
      }
    });

    // ─── Ориентация ───────────────────────────────────────────────────────────
    function updateLayoutForOrientation() {
      var isPortrait = window.matchMedia('(orientation:portrait)').matches;
      var liveBtn = document.getElementById('live-button');
      var paylink = document.getElementById('paylink');
      if(liveBtn) liveBtn.style.display = isPortrait ? 'block' : 'none';
      if(paylink) paylink.style.display = isPortrait ? 'block' : 'none';
    }
    var tiktokLoaded = false;
    function loadTiktokIfLandscape() {
      if(!window.matchMedia('(orientation:landscape)').matches || tiktokLoaded) return;
      tiktokLoaded = true;
      var c = document.getElementById('tiktok-embed-container');
      if(c) {
        c.innerHTML = '<blockquote class="tiktok-embed" cite="https://www.tiktok.com/@kidoliveshop" data-unique-id="kidoliveshop" data-embed-from="embed_page" data-embed-type="creator" style="max-width:780px;min-width:288px;"><section><a target="_blank" href="https://www.tiktok.com/@kidoliveshop/live">@kidoliveshop</a></section></blockquote>';
        var s = document.createElement('script');
        s.src = 'https://www.tiktok.com/embed.js';
        s.async = true;
        document.body.appendChild(s);
      }
    }
    window.matchMedia('(orientation:portrait)').addEventListener('change', function() {
      updateLayoutForOrientation();
      loadTiktokIfLandscape();
    });

    // ─── Частицы ──────────────────────────────────────────────────────────────
    function initParticles() {
      var canvas = document.getElementById('particles-canvas');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      var W, H, particles;
      var SHAPES = ['★','♥','✦','•'];
      var COLORS = ['rgba(255,181,4,','rgba(46,204,113,','rgba(255,128,170,','rgba(0,180,216,'];
      function resize(){ W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      function create(){
        particles = Array.from({length:28}, function(){return{
          x:Math.random()*W, y:Math.random()*H,
          size:8+Math.random()*10,
          speedY:0.2+Math.random()*0.5, speedX:(Math.random()-.5)*.3,
          opacity:0.1+Math.random()*.35,
          shape:SHAPES[Math.floor(Math.random()*SHAPES.length)],
          color:COLORS[Math.floor(Math.random()*COLORS.length)],
          angle:Math.random()*Math.PI*2, spin:(Math.random()-.5)*.02
        };});
      }
      function draw(){
        ctx.clearRect(0,0,W,H);
        particles.forEach(function(p){
          ctx.save();
          ctx.translate(p.x,p.y); ctx.rotate(p.angle);
          ctx.font=p.size+'px serif';
          ctx.fillStyle=p.color+p.opacity+')';
          ctx.textAlign='center'; ctx.textBaseline='middle';
          ctx.fillText(p.shape,0,0); ctx.restore();
          p.y-=p.speedY; p.x+=p.speedX; p.angle+=p.spin;
          if(p.y<-20){p.y=H+20;p.x=Math.random()*W;}
          if(p.x<-20)p.x=W+20; if(p.x>W+20)p.x=-20;
        });
        requestAnimationFrame(draw);
      }
      resize(); create(); draw();
      window.addEventListener('resize', resize);
    }

    // ─── Конфетти (один раз за сессию) ────────────────────────────────────────
    function launchConfetti() {
      if(sessionStorage.getItem('confetti_shown')) return;
      sessionStorage.setItem('confetti_shown','1');
      var canvas = document.getElementById('confetti-canvas');
      if(!canvas) return;
      var ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
      var COLS = ['#ffb504','#2ecc71','#ff80aa','#00b4d8','#ff6b6b','#a29bfe'];
      var pieces = Array.from({length:80}, function(){return{
        x:Math.random()*canvas.width, y:-10-Math.random()*100,
        w:6+Math.random()*8, h:3+Math.random()*5,
        color:COLS[Math.floor(Math.random()*COLS.length)],
        angle:Math.random()*Math.PI, spin:(Math.random()-.5)*.15,
        speedY:2+Math.random()*3, speedX:(Math.random()-.5)*2, opacity:1
      };});
      var frame=0;
      function animate(){
        frame++;
        ctx.clearRect(0,0,canvas.width,canvas.height);
        var alive=false;
        pieces.forEach(function(p){
          p.y+=p.speedY; p.x+=p.speedX; p.angle+=p.spin;
          if(frame>80) p.opacity-=0.012;
          if(p.opacity>0 && p.y<canvas.height+20){
            alive=true;
            ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.angle);
            ctx.globalAlpha=Math.max(0,p.opacity);
            ctx.fillStyle=p.color;
            ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
            ctx.restore();
          }
        });
        if(alive) requestAnimationFrame(animate);
        else ctx.clearRect(0,0,canvas.width,canvas.height);
      }
      animate();
    }

    // ─── Инициализация ────────────────────────────────────────────────────────
    document.addEventListener('DOMContentLoaded', function() {
      updateLayoutForOrientation();
      loadTiktokIfLandscape();
      showTiktokHint();
      initParticles();
      launchConfetti();

      // Случайный логотип
      var logos = ['icons/logo1.png', 'icons/logo1.png', 'icons/logo1.png'];
      var logoEl = document.getElementById('logo');
      if(logoEl) {
        var randomLogo = logos[Math.floor(Math.random() * logos.length)];
        logoEl.src = randomLogo;
      }
    });
  </script>
